name: Fetch creator uploads

on:
  schedule:
    - cron: "52 0 * * *"   # 06:22 IST, before The AI Radar prints at 07:38 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - channels.json
      - scripts/**
      - .github/workflows/fetch.yml

permissions:
  contents: write

concurrency:
  group: fetch-uploads
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch RSS feeds
        run: python scripts/fetch_feeds.py
      - name: Commit data
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add data/uploads.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update creator uploads $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
